<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>The Game Vault | Admin Panel</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin-panel.css}">
</head>

<body>
<div th:insert="~{fragments/nav-bar :: header}"></div>

<main>
    <h2>Admin Panel</h2>

    <div class="dashboard">
        <table>
            <tr>
                <th>User</th>
                <th>Games</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>

            <tr th:each="user : ${users}">
                <td th:text="${user.username}"></td>

                <td th:text="${user.gamesCount}"></td>

                <td th:text="${user.active ? 'Active' : 'Inactive'}"></td>

                <td class="actions">

                    <form class="active-status-form"
                          th:action="@{/admin/toggle/{id}(id=${user.id})}" method="post">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <button type="submit" class="toggle-btn">
                            Toggle Status
                        </button>
                    </form>

                    <form class="promote-admin-form"
                          th:if="${user.role.name() != 'ADMIN'}"
                          th:action="@{/admin/promote/{id}(id=${user.id})}" method="post">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <button type="submit" class="admin-btn">
                            Make Admin
                        </button>
                    </form>

                </td>
            </tr>
        </table>

        <section class="game-manager">

            <a th:href="@{/games}" class="games-link">Browse Games</a>

        </section>

    </div>

</main>

<div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
