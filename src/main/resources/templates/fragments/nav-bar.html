<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Header Fragment</title>
</head>
<body>
<header th:fragment="header" class="header">
    <a th:href="@{/}" class="brand">
        <img th:src="@{/images/tgv-logo.png}"
             alt="The Game Vault logo"
             class="logo-img">

        <div class="brand-text">
            <h2>THE GAME VAULT</h2>
            <p>Your adventure. Your collection.</p>
        </div>
    </a>
    <nav>
        <a href="#">Features</a>
        <a href="#">About</a>
        <a href="#">Contact</a>

        <th:block th:if="${session.userId == null}">
        <a th:href="@{/login}" class="login">
            LOGIN
        </a>

        <a th:href="@{/register}" class="register">
            REGISTER
        </a>
        </th:block>

        <th:block th:if="${session.userId != null}">
            <a th:href="@{/profile}">
                <span th:text="${session.username}">
                    User
                </span>
            </a>
            <a th:href="@{/logout}" class="logout">
                LOGOUT
            </a>
        </th:block>
    </nav>
</header>
</body>
</html>
