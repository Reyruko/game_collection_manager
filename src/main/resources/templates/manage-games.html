<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>The Game Vault | Manage Games</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/games.css}">
    <script th:src="@{/js/submit.js}" defer></script>
</head>

<body>
<div th:insert="~{fragments/nav-bar :: header}"></div>

<main class="games-library">

    <div class="header-container">
        <h2>Manage games</h2>

        <a th:href="@{/manage/games/add}" class="add-game-btn">
            Add Game
        </a>
    </div>
    <table class="games-table">
        <tbody>
        <tr class="table-header">
            <td class="rank">Rank</td>
            <td class="title">Title</td>
            <td class="score">Score</td>
            <td class="status">Status</td>
            <td class="edit-games">Edit</td>
        </tr>
        <tr class="ranking-list" th:each="game, stat : ${games}">
            <td class="rank tc" th:text="${stat.count}">1</td>
            <td class="title tc">
                <div class="detail">
                    <h3 class="game-name" th:text="${game.name}">
                        Game Name
                    </h3>
                    <p class="game-desc" th:text="${game.description}">
                        Game Description here.
                    </p>
                    <p class="platform">
                        <span th:each="platform, stat : ${game.platforms}">
                            <span th:text="${platform.name}"></span>
                            <span th:if="${!stat.last}"> / </span>
                        </span>
                    </p>
                </div>
            </td>
            <td class="score tc" th:text="${game.rating}">
                9.81
            </td>
            <td class="status tc">
                <form class="collection-form" th:action="@{/games/{id}/add(id=${game.id})}" method="post">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <button type="submit">
                        Add to Collection
                    </button>
                </form>
            </td>
            <td class="edit-games tc">
                <form class="collection-form" th:action="@{/games/{id}/edit(id=${game.id})}" method="post">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <button type="submit">
                        Edit Game
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</main>

<div th:insert="~{fragments/footer :: footer}"></div>

</body>
</html>
